name: pipeline

on: [push]

jobs:
  # Docker Hub rate-limits anonymous pulls per runner IP, which the hosted
  # runners share, and lint and test pull their tool images from there. The
  # login script retries and falls back to anonymous pulls.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: scripts/ci-dockerhub-login.sh
      - name: Lint
        run: make lint

  # Builds the image and compiles the fixtures with it, which downloads and
  # installs the real MT4 and MT5 toolchains.
  test:
    # ubuntu-latest is Ubuntu 26.04 with Linux 7.0, where Wine needs the
    # seccomp profile in seccomp/wine.json; the tests and the Action pass it.
    runs-on: ubuntu-latest
    # A passing run takes about six minutes, the first install included.
    # Without a limit, v0.5.1's runs sat in a first install that never
    # finished for six hours before GitHub cancelled them.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: scripts/ci-dockerhub-login.sh
      - name: Test
        # Below the job's limit, so a stuck run still leaves time for the log
        # step after it.
        timeout-minutes: 25
        run: make test-all
      # The suite hides the compiler's stderr; its own copy of the last run is
      # what says where a failed or stuck setup stopped.
      - name: Show the compiler log
        if: failure()
        run: |
          for log in .testing/cache/uid-*/logs/last-run.log; do
            [ -f "$log" ] || continue
            echo "== $log"
            cat "$log"
          done
      # The GitHub Action in this repository, run against the image make test
      # just built and the toolchain it installed.
      - name: Action compiles a good file
        id: action_ok
        uses: ./
        with:
          paths: tests/fixtures/MQL5/Experts/Hello.mq5
          image: psyb0t/mql-compiler:dev
          cache: "false"
          cache-dir: ${{ github.workspace }}/.testing/cache
      - name: Action fails on a broken file
        id: action_broken
        continue-on-error: true
        uses: ./
        with:
          paths: |
            tests/fixtures/MQL5/Experts/Broken.mq5
            tests/fixtures/MQL4/Experts/Hello.mq4
          image: psyb0t/mql-compiler:dev
          cache: "false"
          cache-dir: ${{ github.workspace }}/.testing/cache
      - name: Check the action's outcomes
        env:
          OK_COMPILED: ${{ steps.action_ok.outputs.compiled }}
          BROKEN_OUTCOME: ${{ steps.action_broken.outcome }}
          BROKEN_FAILED: ${{ steps.action_broken.outputs.failed }}
          BROKEN_COMPILED: ${{ steps.action_broken.outputs.compiled }}
        run: |
          test "$OK_COMPILED" = 1
          test "$BROKEN_OUTCOME" = failure
          test "$BROKEN_FAILED" = 1
          test "$BROKEN_COMPILED" = 1

  badges:
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master

  call-docker-image-workflow:
    needs: [lint, test]
    permissions:
      contents: write # GitHub Release
      security-events: write # upload the Grype SARIF to the Security tab
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master

    with:
      repository_name: psyb0t/mql-compiler
      # MT4's MetaEditor is a 32-bit Windows program: the image needs Wine's
      # i386 half, which exists only on amd64.
      target_platforms: "linux/amd64"
      scan_severity: "high"
      cache_mode: "min"
      # Report scan findings to the Security tab but don't fail the run, so the
      # clawhub publish job below can depend on this workflow succeeding.
      scan_fail_build: false

    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  # Publish the skill (.agents/skills/) to ClawHub. Tag pushes ONLY, and only
  # after the Docker image build/push + GitHub release have succeeded.
  publish-to-clawhub:
    needs: [call-docker-image-workflow]
    if: startsWith(github.ref, 'refs/tags/')
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master
    with:
      publish_plugins: false

    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
