title: mql-compiler
tagline: MQL4 and MQL5 compiler for Linux, in Docker
description: Compile MQL4 and MQL5 sources on Linux with MetaQuotes' own MetaEditor running under Wine in Docker, with every compile error as JSON. No Windows, no terminal, no broker account.
lang: en
url: https://psyb0t.github.io
baseurl: /docker-mql-compiler
repository: psyb0t/docker-mql-compiler
author: Ciprian Mandache

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: mocha

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-include-cache

permalink: pretty

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
      seo:
        type: TechArticle

search:
  heading_level: 3

aux_links:
  GitHub:
    - https://github.com/psyb0t/docker-mql-compiler
aux_links_new_tab: true

nav_external_links:
  - title: Changelog
    url: https://github.com/psyb0t/docker-mql-compiler/blob/master/CHANGELOG.md

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
